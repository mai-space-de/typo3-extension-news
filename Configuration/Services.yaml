services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Maispace\MaiNews\:
    resource: '../Classes/*'
    exclude: '../Classes/Domain/Model/*'

  # DataHandler instantiates hooks via GeneralUtility::makeInstance() — must be public for DI
  Maispace\MaiNews\Hook\NewsCacheInvalidationHook:
    public: true

  Maispace\MaiNews\Indexer\NewsIndexer:
    tags:
      - name: 'maispace.search.indexer'
      - name: 'maispace.search.result_formatter'
